<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0f1011; }
  #map { width: 100%; height: 100%; background: #0f1011; }
  .leaflet-control-attribution { background: rgba(15,16,17,.6) !important; color: #62666d !important; font-size: 8px !important; }
  .leaflet-control-attribution a { color: #62666d !important; }
  .leaflet-control-zoom { display: none !important; }
  .tnt-dot { width: 8px; height: 8px; border-radius: 50%; background: #5e6ad2; opacity: .85; box-shadow: 0 0 0 3px rgba(94,106,210,.18); }
  .tnt-car3d { position: relative; width: 36px; height: 32px; }
  .tnt-car3d .shadow { position: absolute; left: 50%; bottom: 1px; width: 24px; height: 7px; border-radius: 50%; background: rgba(0,0,0,.5); filter: blur(1.5px); transform: translateX(-50%); }
  .tnt-car3d .pos { position: absolute; left: 50%; top: 2px; width: 30px; height: 24px; transform: translateX(-50%); }
  .tnt-car3d .flip { width: 100%; height: 100%; transition: transform 140ms linear; }
  .tnt-car3d .body { width: 100%; height: 100%; animation: tntCarBob 1.7s ease-in-out infinite; }
  @keyframes tntCarBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var stops = [
    { lat: -12.4634, lng: 130.8456 },
    { lat: -13.1830, lng: 130.6805 },
    { lat: -12.6692, lng: 132.8352 },
    { lat: -14.3103, lng: 132.4204 },
    { lat: -23.6980, lng: 133.8807 },
    { lat: -24.2634, lng: 131.5567 },
    { lat: -25.3444, lng: 131.0369 }
  ];
  var latlngs = stops.map(function (s) { return [s.lat, s.lng]; });
  var params = new URLSearchParams(location.search);
  var autoplay = params.get('auto') === '1';

  var map = L.map('map', {
    zoomControl: false, attributionControl: true, dragging: false, touchZoom: false,
    scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, tap: false
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  var bounds = L.latLngBounds(latlngs);
  function fitNT() {
    map.invalidateSize();
    map.fitBounds(bounds, { padding: [26, 26] });
  }
  map.setView([-18.5, 132], 5);
  fitNT();
  // Leaflet computes fitBounds against the container's rendered size — if the
  // iframe hadn't finished sizing on first layout, that fit can land off-target.
  // Re-fit once after layout settles, and again on any host resize.
  setTimeout(fitNT, 80);
  setTimeout(fitNT, 300);
  window.addEventListener('resize', fitNT);

  L.polyline(latlngs, { color: '#5e6ad2', weight: 3, opacity: 0.75, dashArray: '1,7', lineCap: 'round' }).addTo(map);
  stops.forEach(function (s) {
    L.marker([s.lat, s.lng], { icon: L.divIcon({ className: 'tnt-dot-wrap', html: '<div class="tnt-dot"></div>', iconSize: [8, 8] }) }).addTo(map);
  });

  // Pseudo-3D car glyph: gradient body for volume, dark window band, shaded
  // wheels, soft ground shadow. Flips horizontally to face its direction of
  // travel instead of rotating (a side-view glyph rotated off-axis reads as
  // broken; flipping reads as "facing the right way" at any bearing).
  var carSvg =
    '<svg width="30" height="24" viewBox="0 0 30 24" xmlns="http://www.w3.org/2000/svg">' +
    '<defs><linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="#8f9aef"/><stop offset="55%" stop-color="#5e6ad2"/><stop offset="100%" stop-color="#454fa8"/>' +
    '</linearGradient></defs>' +
    '<path d="M2 16 L4.5 8.5 Q6 5.5 10 5.5 L20 5.5 Q23.5 5.5 25 8.5 L27.5 16 Z" fill="url(#carBody)" stroke="#333b8a" stroke-width="0.6"/>' +
    '<path d="M9 6.2 L20.5 6.2 L22.5 11 L7 11 Z" fill="#20222b" opacity="0.75"/>' +
    '<circle cx="9" cy="17" r="3.4" fill="#17181c"/><circle cx="9" cy="17" r="1.3" fill="#565b6b"/>' +
    '<circle cx="21.5" cy="17" r="3.4" fill="#17181c"/><circle cx="21.5" cy="17" r="1.3" fill="#565b6b"/>' +
    '<rect x="3" y="14.5" width="24" height="1.6" fill="#f7f8f8" opacity="0.18"/>' +
    '</svg>';

  var carHtml = '<div class="tnt-car3d"><div class="shadow"></div><div class="pos"><div class="flip"><div class="body">' + carSvg + '</div></div></div></div>';
  var carIcon = L.divIcon({ className: 'tnt-car-wrap', html: carHtml, iconSize: [36, 32] });
  var carMarker = L.marker(latlngs[0], { icon: carIcon, zIndexOffset: 1000 }).addTo(map);

  function cumulativeDistances(pts) {
    var d = [0];
    for (var i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      d.push(d[i - 1] + Math.sqrt(dx * dx + dy * dy));
    }
    return d;
  }
  var cum = cumulativeDistances(latlngs);
  var total = cum[cum.length - 1];

  function pointAtFraction(f) {
    f = Math.max(0, Math.min(1, f));
    var target = f * total;
    for (var i = 1; i < cum.length; i++) {
      if (target <= cum[i]) {
        var segFrac = cum[i] === cum[i - 1] ? 0 : (target - cum[i - 1]) / (cum[i] - cum[i - 1]);
        var a = latlngs[i - 1], b = latlngs[i];
        return [a[0] + (b[0] - a[0]) * segFrac, a[1] + (b[1] - a[1]) * segFrac];
      }
    }
    return latlngs[latlngs.length - 1];
  }

  function setCarFacing(dLng) {
    var el = carMarker.getElement();
    if (!el) return;
    var flip = el.querySelector('.flip');
    if (!flip) return;
    flip.style.transform = 'scaleX(' + (dLng < 0 ? -1 : 1) + ')';
  }

  var animId = null;
  var carFraction = 0;
  // Walks the car ALONG the polyline (through every intermediate stop) rather
  // than cutting a straight chord from the current point to the target — a
  // chord skips every waypoint in between when the fraction jump is large.
  function animateCarTo(fraction, onDone) {
    fraction = Math.max(0, Math.min(1, fraction));
    var startFraction = carFraction;
    var span = Math.abs(fraction - startFraction);
    var dur = 700 + span * 3500;
    var t0 = performance.now();
    var lastPoint = pointAtFraction(startFraction);
    if (animId) cancelAnimationFrame(animId);
    function step(now) {
      var t = Math.min(1, (now - t0) / dur);
      var ease = 1 - Math.pow(1 - t, 3);
      var f = startFraction + (fraction - startFraction) * ease;
      var pt = pointAtFraction(f);
      setCarFacing(pt[1] - lastPoint[1]);
      carMarker.setLatLng(pt);
      lastPoint = pt;
      carFraction = f;
      if (t < 1) animId = requestAnimationFrame(step);
      else if (onDone) onDone();
    }
    animId = requestAnimationFrame(step);
  }

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'tnt-progress' && typeof e.data.fraction === 'number') {
      animateCarTo(e.data.fraction);
    }
  });

  if (autoplay) {
    // Ambient decorative loop for screens with no real progress signal
    // (the login backdrop): drive the full route, pause, drive back.
    var dir = 1;
    function loop() {
      animateCarTo(dir > 0 ? 1 : 0, function () {
        setTimeout(function () { dir *= -1; loop(); }, 1400);
      });
    }
    setTimeout(loop, 900);
  }
</script>
</body>
</html>
